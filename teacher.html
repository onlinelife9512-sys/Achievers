<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Teacher Dashboard | GCI Mehsana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#07090f;--card:rgba(18,22,35,.78);--input:rgba(12,16,28,.9);
--border:rgba(120,160,255,.14);--text:#f1f5f9;--muted:#94a3b8;
--cyan:#22d3ee;--blue:#38bdf8;--orange:#fb923c;--green:#34d399;
--red:#f87171;--purple:#a78bfa;--font:'Inter',system-ui,sans-serif;
--display:'Outfit','Inter',system-ui,sans-serif
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:
radial-gradient(ellipse 70% 50% at 15% 0%,rgba(56,189,248,.13),transparent 55%),
radial-gradient(ellipse 60% 45% at 90% 10%,rgba(251,146,60,.09),transparent 50%),
radial-gradient(ellipse 60% 40% at 50% 100%,rgba(167,139,250,.07),transparent 50%)}
.container{width:min(1100px,calc(100% - 28px));margin:auto;padding:28px 0 60px}
.header,.card{background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.3)}
.header{padding:20px 22px;display:flex;align-items:center;gap:15px;margin-bottom:22px}
.logo{width:58px;height:58px;border-radius:15px;background:linear-gradient(135deg,#0ea5e9,#6366f1 50%,#f97316);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:11px;text-align:center;box-shadow:0 0 28px rgba(56,189,248,.3)}
h1{font-family:var(--display);font-size:1.35rem;background:linear-gradient(90deg,#e0f2fe,#7dd3fc,#fdba74);-webkit-background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:.82rem}.tag{display:inline-block;margin-top:6px;padding:3px 9px;border-radius:999px;font-size:.68rem;color:var(--cyan);border:1px solid rgba(34,211,238,.25);background:rgba(34,211,238,.08)}
.login{max-width:430px;margin:60px auto;padding:28px}
.login h2,.dash h2{font-family:var(--display);margin-bottom:7px}
.note{color:var(--muted);font-size:.83rem;margin-bottom:20px}
.field{margin-bottom:15px}.field label{display:block;color:var(--muted);font-size:.8rem;margin-bottom:7px}
input{width:100%;padding:13px 15px;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:11px;outline:none}
input:focus{border-color:rgba(56,189,248,.6);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
.btn{border:0;border-radius:11px;padding:11px 15px;color:white;font-weight:700;cursor:pointer}
.primary{width:100%;background:linear-gradient(105deg,#0ea5e9,#6366f1,#f97316);box-shadow:0 4px 22px rgba(14,165,233,.25)}
.secondary{background:rgba(56,189,248,.09);border:1px solid rgba(56,189,248,.22)}
.logout{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.22)}
.hidden{display:none!important}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{padding:16px}.stat small{color:var(--muted)}.stat strong{display:block;font-family:var(--display);font-size:1.5rem;margin-top:2px}
.list{display:grid;gap:15px}
.doubt{padding:17px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-family:var(--display);font-weight:700;font-size:1.05rem}.meta{color:var(--muted);font-size:.82rem;margin-top:3px}
.badge{padding:4px 9px;border-radius:999px;font-size:.7rem;font-weight:700;white-space:nowrap}
.pending{color:#fdba74;background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.25)}
.solved{color:#6ee7b7;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.25)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.photo{background:rgba(7,9,15,.7);border:1px solid var(--border);border-radius:12px;padding:10px}.photo h4{font-size:.75rem;color:var(--muted);margin-bottom:8px}
.photo img{display:block;width:100%;height:260px;object-fit:contain;background:#02040a;border-radius:8px}
.upload{margin-top:12px;display:grid;gap:9px}.upload input{padding:9px}
.solve{background:linear-gradient(105deg,#0ea5e9,#6366f1,#f97316)}
.empty{text-align:center;padding:35px;color:var(--muted);border:1px dashed var(--border);border-radius:14px}
.error{color:var(--red);font-size:.82rem;margin-top:10px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.photos{grid-template-columns:1fr}.photo img{height:220px}}
@media(max-width:450px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<header class="header">
<div class="logo">GCI<br>MEHSANA</div>
<div>
<h1>Gyanmanjari Career Institute</h1>
<div class="sub">GCI Mehsana • Teacher Panel</div>
<span class="tag">TEACHER DASHBOARD</span>
</div>
</header>

<section class="card login" id="loginBox">
<h2>👨‍🏫 Teacher Login</h2>
<p class="note">Login to view student doubts and upload solutions.</p>
<div class="field"><label>Teacher Name</label><input id="teacherName" placeholder="Enter teacher name"></div>
<div class="field"><label>Password</label><input id="teacherPassword" type="password" placeholder="Enter password"></div>
<button class="btn primary" id="loginBtn">Login</button>
<div id="loginError" class="error"></div>
</section>

<section class="dash hidden" id="dashboard">
<div class="toolbar">
<div><h2>Teacher Dashboard</h2><div class="note" style="margin:0">Pending doubts first</div></div>
<div class="actions">
<button class="btn secondary" id="refreshBtn">↻ Refresh</button>
<button class="btn logout" id="logoutBtn">Logout</button>
</div>
</div>

<div class="stats">
<div class="card stat"><small>Total Doubts</small><strong id="totalCount">0</strong></div>
<div class="card stat"><small>Pending</small><strong id="pendingCount">0</strong></div>
<div class="card stat"><small>Solved</small><strong id="solvedCount">0</strong></div>
</div>

<div class="list" id="doubtList"><div class="empty">Loading doubts...</div></div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://qaueczwungesulwujmch.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_1R9DPCZZH3yjw2L6R5geuQ_OzF4EoZe';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

/* Temporary test login. Replace with Supabase Auth before production. */
const TEACHER_PASSWORD='GCI@2026';

const $=id=>document.getElementById(id);
$('loginBtn').onclick=login;
$('refreshBtn').onclick=loadDoubts;
$('logoutBtn').onclick=()=>{
 $('dashboard').classList.add('hidden');$('loginBox').classList.remove('hidden');
 $('teacherPassword').value='';
};

async function login(){
 const name=$('teacherName').value.trim(), pass=$('teacherPassword').value;
 $('loginError').textContent='';
 if(!name||!pass){$('loginError').textContent='Teacher Name અને Password બંને નાખો.';return}
 if(pass!==TEACHER_PASSWORD){$('loginError').textContent='Wrong password.';return}
 $('loginBox').classList.add('hidden');$('dashboard').classList.remove('hidden');await loadDoubts();
}

async function loadDoubts(){
 $('doubtList').innerHTML='<div class="empty">Loading doubts...</div>';
 const {data,error}=await supabaseClient.from('gci-mehsana')
 .select('id,student_name,roll_number,subject,doubt_photo,solution_photo,status')
 .order('id',{ascending:false});
 if(error){
  $('doubtList').innerHTML='<div class="empty">Doubts load થઈ શક્યા નથી.<div class="error">'+esc(error.message)+'</div><br>Teacher માટે SELECT policy જરૂરી છે.</div>';
  return;
 }
 const rows=data||[];
 rows.sort((a,b)=>(String(a.status||'').toLowerCase()==='solved')-(String(b.status||'').toLowerCase()==='solved'));
 $('totalCount').textContent=rows.length;
 $('pendingCount').textContent=rows.filter(x=>String(x.status||'').toLowerCase()!=='solved').length;
 $('solvedCount').textContent=rows.filter(x=>String(x.status||'').toLowerCase()==='solved').length;
 if(!rows.length){$('doubtList').innerHTML='<div class="empty">No doubts found.</div>';return}
 $('doubtList').innerHTML=rows.map(renderDoubt).join('');
}

function renderDoubt(d){
 const isSolved=String(d.status||'').toLowerCase()==='solved';
 return `<article class="card doubt">
 <div class="top"><div><div class="name">${esc(d.student_name||'Student')}</div>
 <div class="meta">Roll No: ${esc(d.roll_number||'-')} • Subject: ${esc(d.subject||'-')}</div></div>
 <span class="badge ${isSolved?'solved':'pending'}">${isSolved?'Solved':'Pending'}</span></div>
 <div class="photos">
 <div class="photo"><h4>📷 Student Doubt</h4>${d.doubt_photo?`<img src="${escAttr(d.doubt_photo)}">`:'<div class="empty">No photo</div>'}</div>
 <div class="photo"><h4>✅ Teacher Solution</h4>${d.solution_photo?`<img src="${escAttr(d.solution_photo)}">`:'<div class="empty">Not uploaded</div>'}</div>
 </div>
 ${isSolved?'':`<div class="upload"><input type="file" id="solution-${d.id}" accept="image/*"><button class="btn solve" onclick="uploadSolution(${Number(d.id)})">Upload Solution & Mark Solved</button></div>`}
 </article>`;
}

async function uploadSolution(id){
 const input=$('solution-'+id),file=input?.files?.[0],btn=input?.nextElementSibling;
 if(!file)return alert('પહેલા solution photo પસંદ કરો.');
 if(!file.type.startsWith('image/'))return alert('ફક્ત image file upload કરો.');
 if(file.size>5*1024*1024)return alert('Solution photo 5MB થી ઓછી હોવી જોઈએ.');
 btn.disabled=true;btn.textContent='Uploading...';
 try{
  const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path=`solutions/${Date.now()}_${crypto.randomUUID()}_${safe}`;
  const {error:upErr}=await supabaseClient.storage.from('gci-doubts').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});
  if(upErr)throw upErr;
  const {data:urlData}=supabaseClient.storage.from('gci-doubts').getPublicUrl(path);
  const {error:dbErr}=await supabaseClient.from('gci-mehsana').update({solution_photo:urlData.publicUrl,status:'Solved'}).eq('id',id);
  if(dbErr)throw dbErr;
  alert('Solution successfully uploaded અને doubt Solved થયો. ✅');
  await loadDoubts();
 }catch(e){
  alert('Solution upload failed:\\n'+(e.message||e));
  btn.disabled=false;btn.textContent='Upload Solution & Mark Solved';
 }
}
function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function escAttr(v){return esc(v).replaceAll('`','&#096;')}
</script>
</body>
</html>
