
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCI Mehsana</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:Inter,Arial,sans-serif;
  color:#f8fafc;
  background:
    radial-gradient(circle at 15% 10%,rgba(56,189,248,.18),transparent 35%),
    radial-gradient(circle at 85% 20%,rgba(251,146,60,.14),transparent 35%),
    #07090f;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.container{width:min(560px,100%)}
.header{text-align:center;margin-bottom:28px}
.logo{
  width:76px;height:76px;margin:0 auto 16px;border-radius:20px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#0ea5e9,#6366f1 50%,#f97316);
  font-weight:800;font-size:13px;line-height:1.1;
  box-shadow:0 0 35px rgba(56,189,248,.25)
}
h1{font-size:28px;margin-bottom:6px}
.sub{color:#94a3b8;font-size:14px}
.card{
  background:rgba(18,22,35,.88);
  border:1px solid rgba(120,160,255,.18);
  border-radius:22px;
  padding:22px;
  box-shadow:0 18px 50px rgba(0,0,0,.35);
}
.question{text-align:center;color:#94a3b8;margin-bottom:18px}
.option{
  display:block;
  text-decoration:none;
  color:#fff;
  padding:20px;
  border-radius:16px;
  margin-top:14px;
  border:1px solid rgba(120,160,255,.18);
  background:rgba(7,9,15,.72);
  transition:.2s;
}
.option:hover{transform:translateY(-2px);border-color:rgba(56,189,248,.5)}
.icon{font-size:28px;margin-bottom:8px}
.name{font-size:18px;font-weight:700}
.desc{font-size:13px;color:#94a3b8;margin-top:4px}
.footer{text-align:center;color:#64748b;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">GCI<br>MEHSANA</div>
    <h1>Gyanmanjari Career Institute</h1>
    <div class="sub">GCI Mehsana</div>
  </div>

  <div class="card">
    <div class="question">શું ખોલવું છે?</div>

    <a class="option" href="/daily-report.html">
      <div class="icon">📝</div>
      <div class="name">Daily Work Report</div>
      <div class="desc">તમારો દૈનિક study work report submit કરો.</div>
    </a>

    <a class="option" href="https://gci-doubt-section.vercel.app/">
      <div class="icon">❓</div>
      <div class="name">Doubt Section</div>
      <div class="desc">Doubt photo મોકલો અને Teacher solution મેળવો.</div>
    </a>
  </div>

  <div class="footer">Gyanmanjari Career Institute · GCI Mehsana</div>
</div>
</body>
</html>
